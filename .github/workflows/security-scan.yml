name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Plugin security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b  # v7.3.0
      - name: Run security scanner
        run: |
          set +e
          uv run scripts/scan_plugin.py plugins/
          status=$?
          set -e
          # Exit codes: 0 = clean, 1 = usage error, 2 = BLOCK, 3 = WARN
          if [ "$status" -eq 3 ]; then
            echo "::warning::Security scanner found WARN-level findings (review recommended)"
            exit 0
          fi
          exit "$status"
