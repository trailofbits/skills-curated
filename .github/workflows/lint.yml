name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b  # v4.0.0
        with:
          args: check --output-format=github
      - uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b  # v4.0.0
        with:
          args: format --check

  shellcheck:
    name: Shell (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - name: Run shellcheck
        run: |
          shfiles=$(find plugins -name "*.sh" -type f 2>/dev/null)
          if [ -n "$shfiles" ]; then
            echo "$shfiles" | xargs shellcheck -x
          else
            echo "No shell scripts found, skipping"
          fi

  shfmt:
    name: Shell (shfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - name: Install shfmt
        run: |
          curl -sS https://webinstall.dev/shfmt | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run shfmt
        run: |
          shfiles=$(find plugins -name "*.sh" -type f 2>/dev/null)
          if [ -n "$shfiles" ]; then
            echo "$shfiles" | xargs shfmt -i 2 -ci -d
          else
            echo "No shell scripts found, skipping"
          fi

  bats:
    name: Shell (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - name: Install bats and uv
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run hook tests
        run: |
          batfiles=$(find plugins -name "*.bats" -type f 2>/dev/null)
          if [ -n "$batfiles" ]; then
            echo "$batfiles" | xargs bats
          else
            echo "No bats test files found, skipping"
          fi
